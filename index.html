<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="index-container">

    <div class="index-header">
    <h1 id="taulu">Ilmoitustaulu</h1>
    <p id="welcome">Welcome to your board system</p>
  </div>

<div class="login-box">

  <div class="language-select">
        <img src="images/fi.svg" id="langFi" class="lang-flag">
        <img src="images/gb.svg" id="langEn" class="lang-flag">
      </div>

  <div id="boardCount">Boards: ...</div>

  <h3 id="loginTitle">Board Login</h3>

  <form onsubmit="loginWithPassword(); return false;">
    <input id="boardName" placeholder="Board Name">
    <input id="boardUsername" placeholder="Username">
    <input id="boardPassword" type="password" placeholder="Password">
    <button id="openBoardBtn" class="light-yellow-btn" type="submit">Open Board</button>
  </form>
  
  <div class="top-buttons">

      <button id="openCreateBtn" class="light-blue-btn-120" onclick="openCreatePopup()">
        Create Board
      </button>
      
      <button id="openJoinBtn" class="light-blue-btn-120" onclick="openJoinBoard()">
        Join Board
      </button>
      </div>
</div>

</div>

<div id="createPopup" class="popup">
  <div class="popup-content">
    <h3 id="createBoardPopupTitle">Create Board</h3>
    <label for="cp_boardType">Board Type</label>
    <select id="cp_boardType" class="light-blue-btn" onchange="changeCreateBoardType()">
      <option value="family">family</option>
      <option value="notice">notice</option>
    </select>
    <div id="noticeTemplateDiv" style="display:none;">
      <label for="cp_noticeTemplate">Notice Template</label>
      <select id="cp_noticeTemplate">
        <option value="taloyhtio">taloyhtiö</option>
        <option value="yhteiso">yhteisö</option>
        <option value="urheiluseura">urheiluseura</option>     
        <option value="yhdistys">yhdistys</option>
      </select>
    </div>
    <input id="cp_boardName" placeholder="Board Name">
    <input id="cp_username" placeholder="Username">
    <input id="cp_password" placeholder="Password" type="password">
    <input id="cp_email" placeholder="Email">
    <button id="submitCreatePopupBtn" class="light-blue-btn" onclick="submitCreateBoard()">Create</button>
    <button id="closeCreatePopupBtn" class="light-blue-btn" onclick="closeCreatePopup()">Cancel</button>
  </div>
</div>

<div id="joinBoardPopup" class="popup">
  <div class="popup-content">
  <h3 id="joinTitle">Join Board</h3>
  <input id="joinBoardName" placeholder="Board Name">
  <input id="joinUsername" placeholder="Username">
  <input id="joinPassword" type="password" placeholder="Password">
  <input id="joinEmail" type="email" placeholder="Email">
  <br>
  <button id="sendJoinBtn" class="light-blue-btn" onclick="sendJoinRequest()"> Send Request </button>
  <button id="joinCancelBtn" class="light-blue-btn" onclick="closeJoinBoard()"> Cancel </button>
  </div>
</div>

<script src="app.js?v=7"></script>

</body>
</html>
