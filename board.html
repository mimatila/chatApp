<!DOCTYPE html>
<html>
<head>
  <title>chatApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="board-container">

<h1 id="boardTitle"></h1>

<div id="boardDescription"></div>

<!-- 🟢 viimeksi paikalla -->
<div id="visitedUsers" class="visited-users"></div>

<div id="currentLocation"></div>

<div class="board-actions">

    <div class="left-actions">
      <button id="topicBtn" onclick="openTopicPopup()"> New Topic
      </button>
      <button id="backToCategoriesBtn" onclick="backToCategories()">
      Categories
      </button>
      <button id="saunaBtn" class="light-blue-btn-120" onclick="openSauna()"> Sauna Slots</button>
      <button id="autoBtn" class="light-blue-btn" onclick="openAuto()"> Parking Spaces</button>
    </div>
      <button id="clearBtn" class="clearBtn" onclick="clearTable()">
        Clear
      </button>
</div>

<!-- viestit -->
<div class="board">
  <div id="boardCategoriesView">
    <div id="mainCategories"></div>
    <div id="otherCategories"></div>
  </div>

  <!-- topicit -->
  <div id="boardTopicsView"></div>

  <div id="boardMessagesView"></div>

  <div id="boardMessagesDiv"></div>
</div>

<div class="message-options">
  <label>
  <input type="checkbox" class="checkbox" id="importantMode">
  <span id="importantModeText">important</span>
  </label>
  <label>
  <input type="checkbox" class="checkbox" id="infoMode">
  <span id="infoModeText">info</span>
  </label>
  <label>
  <input type="checkbox" class="checkbox" id="todayMode">
  <span id="todayModeText">today</span>
  </label>
  <label>
  <input type="checkbox" class="checkbox" id="editMode">
  <span id="editModeText">edit</span>
  </label>
</div>

  <!-- viesti -->
  <div class="message-area">
    <span id="quickMessagesBtn" onclick="openQuickMessages()">
    💬
    </span>
    <div class="input-row">
    <input id="boardNewMsg" placeholder="Write message...">
    <button id="sendBtn" class="light-blue-btn" onclick="updateMessage()">
    Send
    </button>
    </div>
  </div>
  <button id="menuBtn">☰</button>
<div id="topMenu">
  <button id="members" onclick="showMembers()"> Members </button>
  <button id="requestsBtn" onclick="openRequests()"> Requests </button>
  <button id="deleteBoardBtn" onclick="deleteBoard()"> Delete Board</button>
  <button id="leaveBoardBtn" onclick="leaveBoard()"> Leave Board </button>
  <button id="settingsBtn" onclick="openSettings()"> Settings </button>
  <button id="homeBtn" onclick="home()"> Home </button>
  <button id="logout" onclick="logout()"> Logout </button>
</div>
</div>

<div id="saunaPopup" class="popup">
    <div class="popup-content">
        <h3 class="h3" id="saunaTitle">
            Sauna List
        </h3>
        <table id="saunaTable">
            <thead>
                <tr>
                    <th></th>
                    <th>Ke</th>
                    <th>To</th>
                    <th>Pe</th>
                    <th>La</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>15:00-16:00</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
                <tr>
                    <td>16:00-17:00</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
                <tr>
                    <td>17:00-18:00</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
                <tr>
                    <td>18:00-19:00</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
                <tr>
                    <td>19:00-20:00</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
                <tr>
                    <td>20:00-21:00</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
            </tbody>
        </table>
        <br>
        <div id="saunaButtons">
    <button id="saveSaunaBtn" class="light-blue-btn" onclick="saveSauna()" style="display:none;">
        Save
    </button>
    <button id="editSaunaBtn" class="light-blue-btn-90" onclick="editSauna()">
        Edit
    </button>
    <button id="closeSaunaBtn" class="light-blue-btn-90" onclick="closeSauna()">
        Close
    </button>
</div>
    </div>
</div>

<div id="autoPopup" class="popup">

    <div id="autoPopupContent" class="popup-content">

        <h3 class="h3">
            Parking Slots
        </h3>

        <input id="autoCountInput" type="number" value="5">

        <button id="createAutoPopupBtn" class="light-blue-btn-90" onclick="createAutoSlots()">
            Create
        </button>

        <button id="closeAutoPopupBtn" class="light-blue-btn-90" onclick="closeAutoPopup()">
            Cancel
        </button>

    </div>

</div>

<div id="membersPopup" class="popup">
  <div class="popup-content">
  <h3 class="h3">Members</h3>
  <div id="membersList"></div>
  <br>
  <button id="closeMembersBtn" class="light-blue-btn-90" onclick="closeMembers()">Sulje</button>
  </div>
</div>

<div id="settingsPopup" class="popup">
  <div class="popup-content">
    <h3 class="h3">Asetukset</h3>
    <label>
    Poista viestit vanhempina kuin
    </label>
    <input
    id="autoDeleteDays"
    type="number"
    min="1"
    max="365"
    >
    <span>päivää</span>
    <br><br>
    <button id="saveSettingsBtn" class="light-blue-btn-90" onclick="saveSettings()">
    Tallenna
    </button>
    <button id="closeSettingsBtn" class="light-blue-btn-90" onclick="closeSettings()">
    Sulje
    </button>
  </div>
</div>

<div id="requestsPopup" class="popup">
  <div class="popup-content">
    <h3 class="h3">Join Requests</h3>
    <div id="requestsList"></div>
    <br>
    <button id="closeRequestsBtn" class="light-blue-btn-90" onclick="closeRequests()">Sulje</button>
  </div>
</div>

<div id="quickMessagesPopup" class="popup">
  <div class="popup-content">
    <h3 >Quick Messages</h3>
    <div id="quickMessagesList"></div>
    <br>
    <button id="saveQuickBtn" class="light-blue-btn" onclick="saveQuickMessages()"> Save </button>
    <button id="closeQuickBtn" class="light-blue-btn" onclick="closeQuickMessages()"> Close </button>
  </div>
</div>

<div id="createTopicPopup" class="popup">
  <div class="popup-content">
    <h3 id="createTopicTitle">Create New Topic</h3>
    <div id="categoryTemplateRow">
    <select id="cp_category" onchange="createTopicPopupCategoryChanged()">
    </select>
    <div id="templateSection">
    <select id="messageTemplate" onchange="changeTemplate()">
        <option value="general">Yleinen</option>
        <option value="contact">Yhteystiedot</option>
        <option value="notice">Tiedote</option>
    </select>
</div></div>
    <input id="cp_topic" placeholder="topic" maxlength="40">
    <select id="cp_informationTopic" style="display:none;">
    <option value="general information">
    General information
    </option>
    <option value="announcements">
    Announcements
    </option>
    </select>
    
    <input id="cp_header" type="text" placeholder="Header" maxlength="40">

    <textarea id="cp_message"
    placeholder="Write your message..."
    rows="5"></textarea>

    <div class="topic-type-options">
    <label>
        <input type="checkbox" id="cp_important">
        Important
    </label>

    <label>
        <input type="checkbox" id="cp_info">
        Info
    </label>
</div>
    <button class="light-blue-btn-90" id="cp_createBtn" onclick="submitTopic()">Create</button>
    <button class="light-blue-btn-90" id="cp_cancelBtn" onclick="closeTopicPopup()">Cancel</button>
  </div>
</div>

<script src="app.js?v=7"></script>

</body>
</html>
